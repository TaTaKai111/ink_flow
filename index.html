<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="InkFlow CMS - 个人博客内容管理平台" />
    <title>InkFlow CMS - 博客内容管理平台</title>
    <style>
      /* 首屏加载动画：内联样式，不依赖打包后的 CSS，避免加载期白屏 */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: "PingFang SC", "Noto Sans", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
        overflow: hidden;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
        transition: opacity 0.4s ease;
      }
      #app-splash.is-hide { opacity: 0; pointer-events: none; }
      .splash-logo {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: splash-float 2.4s ease-in-out infinite;
      }
      .splash-logo svg { width: 40px; height: 40px; }
      .splash-name {
        color: #ffffff;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .splash-sub {
        color: rgba(255, 255, 255, 0.75);
        font-size: 13px;
        letter-spacing: 2px;
      }
      .splash-bar {
        width: 180px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.25);
        overflow: hidden;
      }
      .splash-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #ffffff;
        animation: splash-loading 1.2s ease-in-out infinite;
      }
      .splash-tip { color: rgba(255, 255, 255, 0.6); font-size: 12px; }
      @keyframes splash-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes splash-loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(450%); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- 品牌化加载屏：Vue 挂载后由 main.js 移除 -->
    <div id="app-splash">
      <div class="splash-logo">

          />

      </div>
      <div class="splash-name">InkFlow CMS</div>
      <div class="splash-sub">个人博客内容管理平台</div>
      <div class="splash-bar"></div>
      <div class="splash-tip">正在加载资源，请稍候…</div>
    </div>
    <noscript>请开启浏览器 JavaScript 功能后访问本站。</noscript>
    <script>
      // 兜底提示：若 15 秒后应用仍未挂载（如网络异常），引导用户刷新
      window.__splashTimeout = setTimeout(function () {
        var splash = document.getElementById('app-splash')
        var tip = splash && splash.querySelector('.splash-tip')
        if (tip) tip.textContent = '加载时间较长，请刷新页面重试'
      }, 15000)
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
